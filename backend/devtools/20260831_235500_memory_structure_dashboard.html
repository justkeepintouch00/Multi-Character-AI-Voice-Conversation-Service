<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>메모리 구조 비교 평가</title>
  <style>
    :root{--bg:#080d1b;--panel:#131b30;--panel2:#0b1223;--line:#2a3859;--text:#edf2ff;--muted:#9aabd0;--accent:#8b5cf6;--good:#34d399;--warn:#fbbf24}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#080d1b,#12162c);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1500px;margin:auto;padding:30px 24px 70px}h1{margin:0;font-size:29px}h2{font-size:19px;margin:0 0 9px}p{margin:5px 0;color:var(--muted)}.box{background:rgba(19,27,48,.94);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}.load{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--muted)}button{border:0;border-radius:8px;background:var(--accent);color:#fff;padding:10px 14px;font-weight:750;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}.metric .name{font-size:12px;color:var(--muted)}.metric .value{font-size:21px;font-weight:800;margin-top:3px}.good{color:var(--good)}.warn{color:var(--warn)}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;white-space:pre-wrap}.tag{display:inline-block;background:#263553;border-radius:99px;padding:2px 7px;margin:1px;font-size:11px}.empty{color:var(--muted);font-style:italic}@media(max-width:900px){.load{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<main>
  <div class="box"><h1>메모리 구조 비교 평가</h1><p>동일한 C모드 대화 실행에서 DB에 저장된 memory_items와 memory_graph_edges를 v1·v2별로 비교합니다.</p><p>ACL 권한 평가는 별도 화면이며, 의미 정확도의 Precision·Recall·F1은 주석 골드셋이 준비될 때까지 산출하지 않습니다.</p></div>
  <div class="box"><h2>결과 파일 불러오기</h2><div class="load"><div class="field"><label>메모리 구조 v1 JSON</label><input id="v1" type="file" accept=".json,application/json"></div><div class="field"><label>메모리 구조 v2 JSON</label><input id="v2" type="file" accept=".json,application/json"></div><button id="load">비교하기</button></div><p id="status" class="empty"></p></div>
  <div id="summary" class="summary"></div>
  <div class="box"><h2>구조 지표 비교</h2><div class="table-wrap"><table class="table"><thead><tr><th>지표</th><th>v1</th><th>v2</th><th>v2 - v1</th><th>해석</th></tr></thead><tbody id="metrics"></tbody></table></div></div>
  <div class="box"><h2>케이스별 저장 결과</h2><div class="table-wrap"><table class="table"><thead><tr><th>케이스</th><th>v1 상태</th><th>v1 메모리</th><th>v1 유형</th><th>v1 엣지</th><th>v2 상태</th><th>v2 메모리</th><th>v2 유형</th><th>v2 엣지</th></tr></thead><tbody id="cases"><tr><td colspan="9" class="empty">두 결과 JSON을 선택하세요.</td></tr></tbody></table></div></div>
</main>
<script>
(()=>{
  const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])), fmt=v=>typeof v==='number'?(Number.isInteger(v)?String(v):v.toFixed(4)):String(v??'—'), pct=v=>typeof v==='number'?(v*100).toFixed(2)+'%':fmt(v), read=async input=>input.files[0]?JSON.parse(await input.files[0].text()):null;
  const metrics=[['cases_succeeded','성공 케이스','count'],['cases_failed','실패 케이스','count'],['memory_records_total','메모리 레코드 수','count'],['memory_records_per_case','케이스당 메모리 수','number'],['valid_memory_type_rate','유효 메모리 유형률','percent'],['owner_constraint_rate','소유자 제약 만족률','percent'],['source_conversation_coverage','대화 근거 연결률','percent'],['superseded_link_rate','SUPERSEDED 연결률','percent'],['duplicate_content_rate','중복 본문률','percent'],['graph_edges_total','그래프 엣지 수','count'],['graph_edge_case_coverage','엣지 케이스 커버리지','percent'],['graph_edge_valid_rate','유효 엣지률','percent'],['summary_field_presence_rate','요약 필드 존재율','percent']];
  const display=(value,kind)=>kind==='percent'?pct(value):fmt(value);
  function render(a,b){const am=a?.metrics||{},bm=b?.metrics||{};const delta=(x,y)=>typeof x==='number'&&typeof y==='number'?y-x:null;$('summary').innerHTML=[['v1 케이스',am.cases_total??'—',''],['v2 케이스',bm.cases_total??'—',''],['v1 메모리',am.memory_records_total??'—',''],['v2 메모리',bm.memory_records_total??'—',''],['v1 그래프 엣지',am.graph_edges_total??'—',''],['v2 그래프 엣지',bm.graph_edges_total??'—','']].map(x=>`<div class="metric"><div class="name">${esc(x[0])}</div><div class="value">${esc(x[1])}</div></div>`).join('');$('metrics').innerHTML=metrics.map(([key,label,kind])=>{const x=am[key],y=bm[key],d=delta(x,y);const interpretation=key.includes('duplicate')?'낮을수록 좋음':key.includes('superseded')?'갱신 로직 연결 여부':key.includes('summary')?'현재 구현에서 요약 저장 여부':'높을수록 구조가 안정적';return `<tr><td>${esc(label)}<br><span class="mono">${esc(key)}</span></td><td>${esc(display(x,kind))}</td><td>${esc(display(y,kind))}</td><td>${esc(d==null?'—':display(d,kind))}</td><td>${esc(interpretation)}</td></tr>`}).join('');const ids=new Set([...(a?.cases||[]).map(x=>x.case_id),...(b?.cases||[]).map(x=>x.case_id)]);const by=(report,id)=>report?.cases?.find(x=>x.case_id===id);const types=row=>[...new Set((row?.memories||[]).map(x=>x.memory_type))].join(', ')||'—';$('cases').innerHTML=[...ids].sort().map(id=>{const x=by(a,id),y=by(b,id);return `<tr><td>${esc(id)}</td><td>${esc(x?.request_status||'—')}</td><td>${esc(x?.memories?.length??'—')}</td><td>${esc(types(x))}</td><td>${esc(x?.graph_edges?.length??'—')}</td><td>${esc(y?.request_status||'—')}</td><td>${esc(y?.memories?.length??'—')}</td><td>${esc(types(y))}</td><td>${esc(y?.graph_edges?.length??'—')}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">케이스가 없습니다.</td></tr>';}
  $('load').onclick=async()=>{try{const [a,b]=await Promise.all([read($('v1')),read($('v2'))]);if(!a||!b)throw new Error('v1과 v2 결과 JSON을 모두 선택하세요.');render(a,b);$('status').textContent=`v1 ${a.policy_version||'unknown'} · v2 ${b.policy_version||'unknown'} 결과를 불러왔습니다.`}catch(e){$('status').textContent='불러오기 실패: '+e.message}};
})();
</script>
</body>
</html>
