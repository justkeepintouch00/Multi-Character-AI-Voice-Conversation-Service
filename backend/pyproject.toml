[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "character-companion-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.18,<1.19",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "imageio-ffmpeg>=0.5,<1",
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "langsmith>=0.3,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


